# docker-compose for iPedro V2.
# On Unraid, drop this file alongside `.env` (copy from .env.example) and run
# `docker compose up -d` from the share. The "ipedro_pgdata" named volume keeps
# Postgres data across container/image updates.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ipedro}
      POSTGRES_USER: ${POSTGRES_USER:-ipedro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ipedro}
    volumes:
      - ipedro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ipedro}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Uncomment to expose Postgres on the host (e.g. for backups):
    # ports:
    #   - "5432:5432"

  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ipedro-v2:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      # Override DATABASE_URL so it points at the compose service name.
      DATABASE_URL: postgresql://${POSTGRES_USER:-ipedro}:${POSTGRES_PASSWORD:-ipedro}@postgres:5432/${POSTGRES_DB:-ipedro}

volumes:
  ipedro_pgdata:
